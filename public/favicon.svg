<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle / Rounded Square -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#3b82f6" stroke-width="1.5" />

  <!-- Cycle Orbital Arrows (Rotating Cycle symbol) -->
  <g filter="url(#glow)">
    <!-- Top-Right to Bottom-Right Arc Arrow -->
    <path d="M 32 10 A 22 22 0 0 1 54 32" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" stroke-dasharray="24 6" opacity="0.85" />
    <polygon points="54,29 57,35 50,34" fill="#93c5fd" />

    <!-- Bottom-Left to Top-Left Arc Arrow -->
    <path d="M 32 54 A 22 22 0 0 1 10 32" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" stroke-dasharray="24 6" opacity="0.85" />
    <polygon points="10,35 7,29 14,30" fill="#93c5fd" />
  </g>

  <!-- Central Stylized Open Book -->
  <g filter="url(#glow)">
    <!-- Left Page -->
    <path d="M 32 44 C 27 40 18 40 16 42 L 16 23 C 18 21 27 21 32 25 Z" fill="url(#bookGrad)" stroke="#cbd5e1" stroke-width="0.8" />
    <!-- Right Page -->
    <path d="M 32 44 C 37 40 46 40 48 42 L 48 23 C 46 21 37 21 32 25 Z" fill="url(#bookGrad)" stroke="#cbd5e1" stroke-width="0.8" />
    <!-- Center Spine -->
    <line x1="32" y1="25" x2="32" y2="44" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <!-- Left Page Lines -->
    <line x1="20" y1="27" x2="28" y2="29" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />
    <line x1="20" y1="32" x2="28" y2="34" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />
    <line x1="20" y1="37" x2="28" y2="39" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />
    <!-- Right Page Lines -->
    <line x1="36" y1="29" x2="44" y2="27" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />
    <line x1="36" y1="34" x2="44" y2="32" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />
    <line x1="36" y1="39" x2="44" y2="37" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Sparkle / Star of Achievement above book -->
  <g transform="translate(32, 18)" filter="url(#glow)">
    <polygon points="0,-5 1.5,-1.5 5,0 1.5,1.5 0,5 -1.5,1.5 -5,0 -1.5,-1.5" fill="url(#accentGrad)" />
    <circle cx="0" cy="0" r="1.5" fill="#ffffff" />
  </g>
</svg>
